name: Build OpenWrt x86_64 with RTL8180/RTL8185

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: openwrt-23.05

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils-from-gnu build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target & RTL8180 Driver
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-eeprom-93cx6=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_luci=y
          EOF
          echo "CONFIG_RTL8180=m" >> target/linux/x86/config-5.15
          make defconfig

      - name: Compile OpenWrt
        run: |
          make -j$(nproc) V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-rtl8185
          path: bin/targets/x86/64/*.img.gz
